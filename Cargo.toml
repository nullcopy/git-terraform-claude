[package]
name = "git-terraform"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "Adjust and analyze commit timestamps in a Git repository"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.18"
anyhow = "1.0"
colored = "2.1"
regex = "1.10"
dialoguer = "0.11"
indicatif = "0.17"
serde_json = "1.0"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true